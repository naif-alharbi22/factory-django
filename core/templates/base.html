{% load static fmt %}<!-- قالب أساسي: RTL عربي مع DaisyUI -->
<html lang="ar" dir="rtl" data-theme="factory">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ APP_TITLE }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>">
</head>
<body class="min-h-screen bg-base-200">

{% block chrome %}
  {% include "partials/navbar.html" %}
{% endblock %}

<main class="{% block main_class %}mx-auto w-full max-w-7xl px-4 py-6{% endblock %}">
  {% include "partials/messages.html" %}
  {% block content %}{% endblock %}
</main>

<script>
  // حفظ اختيار الوضع الليلي
  (function () {
    const saved = localStorage.getItem("factory-theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
    window.toggleTheme = function () {
      const el = document.documentElement;
      const next = el.getAttribute("data-theme") === "factorydark" ? "factory" : "factorydark";
      el.setAttribute("data-theme", next);
      localStorage.setItem("factory-theme", next);
    };
  })();

  // إغلاق النوافذ المنبثقة بعد نجاح الحفظ
  document.body.addEventListener("htmx:afterSwap", function () {
    document.querySelectorAll("dialog[data-autoclose]").forEach(d => d.close());
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
