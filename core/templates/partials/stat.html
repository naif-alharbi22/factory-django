<div class="card bg-base-100 shadow-sm transition-shadow hover:shadow-md">
  <div class="card-body flex-row items-center gap-4 p-5">
    <div class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-{{ tone|default:'primary' }}/10 text-2xl">
      {{ icon }}
    </div>
    <div class="min-w-0">
      <div class="text-xs font-medium opacity-60">{{ label }}</div>
      <div class="nums mt-0.5 text-2xl font-bold leading-tight">{{ value }}</div>
      <div class="text-[11px] opacity-50">{{ unit }}</div>
    </div>
  </div>
</div>
