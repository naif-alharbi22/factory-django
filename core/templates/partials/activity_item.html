{% load fmt %}
<!-- سطر واحد من حركة الأنشطة — مشترك بين لوحة المعلومات وصفحة التقارير -->
<div class="flex items-start gap-3 rounded-box border border-base-200 p-3">
  <div class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-base-200 text-sm">
    {{ item.action|action_icon }}
  </div>
  <div class="min-w-0 flex-1">
    <div class="text-sm font-medium">{{ item.description }}</div>
    <div class="mt-0.5 flex flex-wrap items-center gap-x-2 gap-y-1 text-[11px] opacity-60">
      <span>{{ item.actor_name|default:"—" }}</span>
      <span>·</span>
      <span class="nums" title="{{ item.created_at|date:'Y-m-d H:i' }}">{{ item.created_at|date:"Y-m-d H:i" }}</span>
      {% if item.project_name %}
        <span>·</span>
        {% if item.project_url %}
          <a href="{{ item.project_url }}" class="link link-primary">{{ item.project_name }}</a>
        {% else %}
          <span>{{ item.project_name }}</span>
        {% endif %}
      {% endif %}
    </div>
  </div>
</div>
