# Project cost management system — running with Docker
#
#   1) cp .env.example .env   then put the Supabase connection details in it
#      (DATABASE_URL, or SUPABASE_PROJECT_REF with SUPABASE_DB_PASSWORD)
#   2) docker compose up -d --build
#   3) one-off migration of the legacy system's data:
#      docker compose --profile tools run --rm import

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: factory-projects:latest
    container_name: factory-web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-*}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-1}"
      # Display time zone; stored timestamps stay UTC either way
      DISPLAY_TIME_ZONE: "${DISPLAY_TIME_ZONE:-Asia/Riyadh}"
      # Container clock, for log timestamps only
      TZ: "${TZ:-UTC}"
      # SQLite file path — used only in local development mode (USE_SQLITE=1)
      SQLITE_PATH: /app/data/factory.sqlite3
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media:/app/media
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/login/", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # One-off service: import the legacy system's data.
  # Important: mount the whole directory, not just the .db file — the -wal and
  # -shm files are needed too.
  import:
    profiles: ["tools"]
    image: factory-projects:latest
    depends_on:
      - web
    env_file:
      - path: .env
        required: false
    environment:
      SQLITE_PATH: /app/data/factory.sqlite3
      TZ: "${TZ:-Asia/Riyadh}"
    volumes:
      - sqlite-data:/app/data
      - "${LEGACY_DIR:-../factory-projects/server}:/legacy:ro"
    command:
      - python
      - manage.py
      - import_legacy
      - --source
      - /legacy/factory_management.db
      - --flush

volumes:
  media:
  sqlite-data:
