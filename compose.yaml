# Project cost management system — running with Docker
#
#   1) cp .env.example .env   then set POSTGRES_PASSWORD and DATABASE_URL
#   2) docker compose up -d --build
#   3) one-off migration of the legacy system's data:
#      docker compose --profile tools run --rm import

services:
  # Same image and layout as compose.prod.yml, so development runs against the
  # engine that production uses. The data lives in its own volume and is not
  # shared with the production stack.
  db:
    image: postgres:17
    container_name: factory-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-factory}"
      POSTGRES_USER: "${POSTGRES_USER:-factory}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      TZ: "UTC"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-factory}\" -d \"${POSTGRES_DB:-factory}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: factory-projects:latest
    container_name: factory-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-*}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-1}"
      # Display time zone; stored timestamps stay UTC either way
      DISPLAY_TIME_ZONE: "${DISPLAY_TIME_ZONE:-Asia/Riyadh}"
      # Container clock, for log timestamps only
      TZ: "${TZ:-UTC}"
      # SQLite file path — used only in local development mode (USE_SQLITE=1)
      SQLITE_PATH: /app/data/factory.sqlite3
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media:/app/media
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/login/", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # One-off service: import the legacy system's data.
  # Important: mount the whole directory, not just the .db file — the -wal and
  # -shm files are needed too.
  import:
    profiles: ["tools"]
    image: factory-projects:latest
    depends_on:
      - web
    env_file:
      - path: .env
        required: false
    environment:
      SQLITE_PATH: /app/data/factory.sqlite3
      TZ: "${TZ:-Asia/Riyadh}"
    volumes:
      - sqlite-data:/app/data
      - "${LEGACY_DIR:-../factory-projects/server}:/legacy:ro"
    command:
      - python
      - manage.py
      - import_legacy
      - --source
      - /legacy/factory_management.db
      - --flush

volumes:
  pgdata:
  media:
  sqlite-data:
