# Checks run on every pull request; publishing happens only on main.
#
#   pull request  ->  tests + migration check + a full image build (not pushed)
#   push to main  ->  the same, then the image is published to GHCR
#
# So a change is proven before it is merged, not after. The VPS never builds
# anything: Watchtower there watches the published tag and pulls the new image
# within a couple of minutes (see compose.prod.yml).
name: Checks and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer commit supersedes a run still in progress on the same branch or PR.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # WeasyPrint's runtime libraries: the report tests build a real PDF.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8 fonts-noto-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The templates use ManifestStaticFilesStorage, which resolves {% static %}
      # through staticfiles/staticfiles.json. That manifest is generated, not
      # committed, so without this step every view test fails with
      # "Missing staticfiles manifest entry". The Dockerfile does the same.
      - name: Collect static files
        env:
          USE_SQLITE: "1"
          DJANGO_SECRET_KEY: ci-only-key-not-used-in-production
        run: python manage.py collectstatic --noinput

      # Catches a model edited without its migration — which would otherwise
      # only surface as a runtime error after deployment.
      - name: Check for missing migrations
        env:
          USE_SQLITE: "1"
          DJANGO_SECRET_KEY: ci-only-key-not-used-in-production
        run: python manage.py makemigrations --check --dry-run

      # USE_SQLITE keeps the suite off Supabase; settings.py does this by
      # default under `manage.py test`, and it is set here to be explicit.
      - name: Run tests
        env:
          USE_SQLITE: "1"
          DJANGO_SECRET_KEY: ci-only-key-not-used-in-production
        run: python manage.py test core

  publish:
    # On a pull request this job still builds the image, so a broken Dockerfile
    # is caught before merging; it just does not push the result.
    name: Build image (published on main)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # lets GITHUB_TOKEN push to GHCR — no PAT needed
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Skipped for pull requests: nothing is pushed, so no credentials are
      # needed, and a fork's token could not sign in anyway.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # :latest is what Watchtower follows; the sha tag lets you roll back
          # to an exact commit.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
