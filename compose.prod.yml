# Production stack for the VPS — automatic deployment.
#
# Nothing is built here: the image is built by GitHub Actions on every push to
# main (.github/workflows/deploy.yml) and published to GHCR. Watchtower below
# watches that tag and replaces the running container as soon as a new image
# appears, applying migrations through the usual entrypoint.
#
# Start it once:
#   docker compose -f compose.prod.yml up -d
#
# From then on, pushing to main is the whole deployment.
#
# The database runs here too (the db service below), so the stack is
# self-contained: nothing but Caddy talks to the outside world.
#
# Requires a .env file next to this one — see .env.example.

services:
  # PostgreSQL, on this host. The application data lives in the pgdata volume
  # below — that volume IS the database; never delete it casually.
  #
  # There is deliberately no `ports:` entry: 5432 stays on the internal compose
  # network, unreachable from the internet. To connect a client from a laptop,
  # tunnel instead of publishing the port:
  #   ssh -L 5432:127.0.0.1:5432 user@this-server
  #   docker compose -f compose.prod.yml exec db psql -U "$POSTGRES_USER" "$POSTGRES_DB"
  db:
    # Pinned to the major version on purpose. Postgres does not read the data
    # directory of a newer major, so an unattended bump to 18 would leave the
    # container crash-looping — an upgrade needs a dump and restore.
    image: postgres:17
    container_name: factory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-factory}"
      POSTGRES_USER: "${POSTGRES_USER:-factory}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      # Keeps the server's own clock in UTC; Django converts for display.
      TZ: "UTC"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-factory}\" -d \"${POSTGRES_DB:-factory}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No Watchtower label: this container is never replaced automatically.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/naif-alharbi22/factory-django:latest
    container_name: factory-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-1}"
      # Display zone only; timestamps are stored in UTC either way.
      DISPLAY_TIME_ZONE: "${DISPLAY_TIME_ZONE:-Asia/Riyadh}"
      # Container clock, for log timestamps.
      TZ: "${TZ:-UTC}"
    ports:
      # Caddy reaches the app over the internal network, so this publish is
      # only for direct access while setting things up. Once HTTPS works, set
      # WEB_BIND=127.0.0.1 in .env so the app is reachable through TLS only.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8000}:8000"
    volumes:
      # Application data lives in the db service; only uploads are on disk.
      - media:/app/media
    labels:
      # Watchtower only touches containers carrying this label.
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/login/", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # TLS and the public entry point. Certificates are issued and renewed
  # automatically, and stored in the caddy-data volume — keep that volume.
  caddy:
    image: caddy:2-alpine
    container_name: factory-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Fails fast with a readable message when the domain is not configured.
      SITE_DOMAIN: "${SITE_DOMAIN:?set SITE_DOMAIN in .env, e.g. app.example.com}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
      TZ: "${TZ:-UTC}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: factory-watchtower
    restart: unless-stopped
    volumes:
      # Read-only is enough to inspect, pull and recreate containers.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Watchtower still defaults to Docker API 1.25, which daemons from
      # Engine 29 on refuse ("client version 1.25 is too old. Minimum
      # supported API version is 1.40"), leaving it unable to talk to Docker
      # at all. Pin a version inside the range every current daemon accepts.
      DOCKER_API_VERSION: "1.44"
      # Only labelled containers, so nothing else on this host is touched.
      WATCHTOWER_LABEL_ENABLE: "true"
      # How often GHCR is checked for a new digest, in seconds.
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_INTERVAL:-120}"
      # Delete the image that was replaced, so the disk does not fill up.
      WATCHTOWER_CLEANUP: "true"
      TZ: "${TZ:-UTC}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # The database itself. Backing up the server without backing up this
  # volume backs up nothing that matters.
  pgdata:
  media:
  caddy-data:
  caddy-config:
