# ===============================================================
#  Deployment compose file — for panel-based Docker managers
# ===============================================================
#  Paste this into your VPS panel (Docker Manager, Portainer stack, ...).
#
#  It references a prebuilt image instead of building from source, because
#  panels have no build context on the server. Build and push the image
#  first — see DEPLOY.md.
#
#  Replace every CHANGE_ME value before deploying.
# ===============================================================

services:
  # ---------- PostgreSQL ----------
  # Runs on this same host. There is no `ports:` entry on purpose: 5432 stays
  # on the internal network, unreachable from the internet. Reach it with a
  # desktop client through an SSH tunnel instead:
  #   ssh -L 5432:127.0.0.1:5432 user@your-server
  db:
    # Pinned to the major version. A newer Postgres refuses to open an older
    # data directory, so an unattended bump would leave this crash-looping.
    image: postgres:17
    container_name: app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "factory"
      POSTGRES_USER: "factory"
      # Use the same value inside DATABASE_URL below.
      POSTGRES_PASSWORD: "CHANGE_ME_DB_PASSWORD"
      TZ: "UTC"
    volumes:
      # This volume IS the database. Deleting it deletes the application data.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: CHANGE_ME_REGISTRY/CHANGE_ME_USER/CHANGE_ME_IMAGE:latest
    container_name: app-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

    environment:
      # ---------- Database (required) ----------
      # The app will not start without this. "db" is the service above,
      # resolved on the internal network; the password must match
      # POSTGRES_PASSWORD there, percent-encoded if it contains @ : / or #.
      DATABASE_URL: "postgresql://factory:CHANGE_ME_DB_PASSWORD@db:5432/factory"

      # 0 because the connection never leaves this host and the postgres
      # image ships without a TLS certificate. Set to 1 for any database
      # reached over a network.
      DB_SSL_REQUIRE: "0"
      DB_CONN_MAX_AGE: "60"

      # ---------- Django ----------
      # Generate with:
      #   python3 -c "import secrets; print(secrets.token_urlsafe(64))"
      DJANGO_SECRET_KEY: "CHANGE_ME_LONG_RANDOM_VALUE"
      DJANGO_DEBUG: "0"
      # Every hostname users will reach the app by, comma separated.
      # Anything not listed here is rejected with HTTP 400.
      # Use ".example.com" to cover all subdomains. CSRF origins are
      # derived from this automatically.
      DJANGO_ALLOWED_HOSTS: "CHANGE_ME_DOMAIN_OR_IP"

      # Enable these only once HTTPS terminates in front of the container.
      # DJANGO_BEHIND_PROXY: "1"
      # DJANGO_SECURE_COOKIES: "1"
      # Only needed if the public URL differs from the hostname above:
      # DJANGO_CSRF_TRUSTED: "https://CHANGE_ME_DOMAIN"

      # ---------- Time ----------
      # Timestamps are always stored in UTC. This is the display zone only:
      # what users, PDF reports and form defaults see.
      DISPLAY_TIME_ZONE: "Asia/Riyadh"

      # ---------- Runtime ----------
      RUN_MIGRATIONS: "1"
      # The container clock, used for log timestamps only.
      TZ: "UTC"

    ports:
      # The left-hand side is the host port. Use "127.0.0.1:8000:8000"
      # when a reverse proxy sits in front of the app.
      - "8000:8000"

    volumes:
      - media:/app/media

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/login/", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  media:
